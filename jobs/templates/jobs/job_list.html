<!DOCTYPE html>
<html>
<head>
    <title>Job Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .search-box {
            text-align: center;
            margin: 25px 0;
        }

        .search-box input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-box button,
        .clear-btn {
            padding: 10px 18px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .search-box button {
            background-color: #007bff;
            color: white;
        }

        .clear-btn {
            background-color: #777;
            color: white;
        }

        .job-card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .job-card h2 {
            color: #222;
        }

        .apply-btn,
        .details-btn {
            display: inline-block;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        .apply-btn {
            background-color: #007bff;
        }

        .details-btn {
            background-color: #28a745;
        }

        .apply-btn:hover {
            background-color: #0056b3;
        }

        .details-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <h1>Available Jobs</h1>

    <div class="search-box">

        <form method="GET">

            <input
                type="text"
                name="q"
                placeholder="Search jobs or company..."
                value="{{ query|default:'' }}"
            >

            <button type="submit">Search</button>

            {% if query %}
                <a class="clear-btn" href="{% url 'job_list' %}">
                    Clear
                </a>
            {% endif %}

        </form>

    </div>

    {% for job in jobs %}

    <div class="job-card">

        <h2>{{ job.title }}</h2>

        <p>
            <strong>Company:</strong> {{ job.company }}
        </p>

        <p>
            <strong>Location:</strong> {{ job.location }}
        </p>

        <p>
            <strong>Salary:</strong> {{ job.salary }}
        </p>

        <p>
            <strong>Description:</strong>
        </p>

        <p>{{ job.description }}</p>

        <a
            class="details-btn"
            href="{% url 'job_detail' job.id %}"
        >
            View Details
        </a>

        <a
            class="apply-btn"
            href="{% url 'apply_job' job.id %}"
        >
            Apply Now
        </a>

    </div>

    {% empty %}

        <p style="text-align: center;">
            No jobs available.
        </p>

    {% endfor %}

</body>
</html>
