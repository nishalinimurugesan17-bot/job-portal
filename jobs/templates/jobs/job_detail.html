<!DOCTYPE html>
<html>
<head>
    <title>Job Details</title>
</head>

<body>

    <h1>Job Details</h1>

    <h2>{{ job.title }}</h2>

    <p><strong>Company:</strong> {{ job.company }}</p>

    <p><strong>Location:</strong> {{ job.location }}</p>

    <p><strong>Salary:</strong> {{ job.salary }}</p>

    <p><strong>Description:</strong></p>
    <p>{{ job.description }}</p>

    <br>

    <a href="{% url 'apply_job' job.id %}">
        Apply Now
    </a>

    <br><br>

    <a href="{% url 'job_list' %}">
        Back to Jobs
    </a>

</body>
</html>
